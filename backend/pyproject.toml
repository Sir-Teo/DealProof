[project]
name = "dealproof-backend"
version = "0.1.0"
description = "FastAPI and LangGraph backend for DealProof diligence analysis."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "langgraph>=0.2.60",
  "openpyxl>=3.1.0",
  "pydantic>=2.9.2",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.12",
  "python-pptx>=1.0.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "reportlab>=4.2.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "real_live: opt-in tests that refresh or validate against live public sources",
]
